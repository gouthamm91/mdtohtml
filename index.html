<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Markdown to HTML Converter</title>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        /* Base & Design Tokens */
        :root {
            --font-family: Verdana, Geneva, Tahoma, sans-serif;
            --bg-primary: #f8fafc;
            --bg-secondary: #ffffff;
            --bg-tertiary: #f1f5f9;
            --text-primary: #0f172a;
            --text-secondary: #475569;
            --text-muted: #94a3b8;
            --border-color: #cbd5e1;
            --accent-color: #2563eb;
            --accent-hover: #1d4ed8;
            --accent-light: #eff6ff;
            --code-bg: #f1f5f9;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --header-height: 60px;
            --toolbar-height: 48px;
            --footer-height: 32px;
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-secondary: #1e293b;
            --bg-tertiary: #334155;
            --text-primary: #f8fafc;
            --text-secondary: #cbd5e1;
            --text-muted: #64748b;
            --border-color: #334155;
            --accent-color: #3b82f6;
            --accent-hover: #60a5fa;
            --accent-light: #1e3a8a;
            --code-bg: #0f172a;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3);
        }

        /* Global Reset */
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: var(--font-family);
            background-color: var(--bg-primary);
            color: var(--text-primary);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
            transition: background-color 0.2s, color 0.2s;
        }

        /* Navigation Header */
        header {
            height: var(--header-height);
            background-color: var(--bg-secondary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            z-index: 10;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            font-size: 1.1rem;
            color: var(--accent-color);
        }

        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        /* Button Styles */
        .btn {
            font-family: var(--font-family);
            background-color: var(--bg-tertiary);
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 6px 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s ease;
        }

        .btn:hover {
            background-color: var(--border-color);
        }

        .btn-primary {
            background-color: var(--accent-color);
            color: #ffffff;
            border-color: var(--accent-color);
        }

        .btn-primary:hover {
            background-color: var(--accent-hover);
        }

        select.btn {
            padding-right: 20px;
            cursor: pointer;
        }

        /* Layout / Split View */
        .main-container {
            display: flex;
            flex: 1;
            height: calc(100vh - var(--header-height) - var(--footer-height));
            position: relative;
            overflow: hidden;
        }

        .panel {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            background-color: var(--bg-secondary);
        }

        .panel-left {
            width: 50%;
            border-right: 1px solid var(--border-color);
        }

        .panel-right {
            width: 50%;
        }

        /* Resizer divider */
        .resizer {
            width: 6px;
            background-color: var(--bg-primary);
            border-left: 1px solid var(--border-color);
            border-right: 1px solid var(--border-color);
            cursor: col-resize;
            z-index: 5;
            transition: background-color 0.2s;
        }

        .resizer:hover, .resizer.dragging {
            background-color: var(--accent-color);
        }

        /* Panel Header / Toolbar */
        .panel-header {
            height: var(--toolbar-height);
            background-color: var(--bg-tertiary);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
        }

        .panel-title {
            font-weight: bold;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: var(--text-secondary);
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .panel-toolbar {
            display: flex;
            gap: 6px;
        }

        /* Editor Area */
        .editor-container {
            flex: 1;
            position: relative;
        }

        textarea#markdown-input {
            width: 100%;
            height: 100%;
            padding: 16px;
            border: none;
            outline: none;
            resize: none;
            font-family: var(--font-family);
            font-size: 0.95rem;
            line-height: 1.6;
            background-color: var(--bg-secondary);
            color: var(--text-primary);
        }

        /* Output & Preview Area */
        .output-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 24px;
            background-color: var(--bg-secondary);
        }

        #html-raw-view {
            width: 100%;
            height: 100%;
            padding: 16px;
            font-family: 'Courier New', Courier, monospace;
            font-size: 0.9rem;
            line-height: 1.5;
            border: none;
            outline: none;
            resize: none;
            background-color: var(--code-bg);
            color: var(--text-primary);
            display: none;
            border-radius: 6px;
        }

        /* Rendered Markdown Styling */
        .markdown-rendered {
            line-height: 1.7;
            word-wrap: break-word;
        }

        .markdown-rendered h1, 
        .markdown-rendered h2, 
        .markdown-rendered h3, 
        .markdown-rendered h4, 
        .markdown-rendered h5, 
        .markdown-rendered h6 {
            margin-top: 1.2em;
            margin-bottom: 0.6em;
            font-weight: bold;
            line-height: 1.3;
            color: var(--text-primary);
        }

        .markdown-rendered h1 { font-size: 1.8rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        .markdown-rendered h2 { font-size: 1.4rem; border-bottom: 1px solid var(--border-color); padding-bottom: 0.3em; }
        .markdown-rendered h3 { font-size: 1.2rem; }
        .markdown-rendered h4 { font-size: 1.0rem; }

        .markdown-rendered p {
            margin-bottom: 1em;
        }

        .markdown-rendered a {
            color: var(--accent-color);
            text-decoration: underline;
        }

        .markdown-rendered strong { font-weight: bold; }
        .markdown-rendered em { font-style: italic; }

        .markdown-rendered blockquote {
            padding: 8px 16px;
            margin: 0 0 16px 0;
            border-left: 4px solid var(--accent-color);
            background-color: var(--bg-tertiary);
            color: var(--text-secondary);
            border-radius: 0 6px 6px 0;
        }

        .markdown-rendered code {
            font-family: 'Courier New', Courier, monospace;
            background-color: var(--code-bg);
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 0.88em;
            border: 1px solid var(--border-color);
        }

        .markdown-rendered pre {
            background-color: var(--code-bg);
            padding: 14px;
            border-radius: 6px;
            overflow-x: auto;
            margin-bottom: 1em;
            border: 1px solid var(--border-color);
        }

        .markdown-rendered pre code {
            background: transparent;
            padding: 0;
            border: none;
            font-size: 0.9em;
        }

        .markdown-rendered ul, 
        .markdown-rendered ol {
            padding-left: 24px;
            margin-bottom: 1em;
        }

        .markdown-rendered li {
            margin-bottom: 0.3em;
        }

        .markdown-rendered table {
            width: 100%;
            border-collapse: collapse;
            margin-bottom: 1em;
        }

        .markdown-rendered th, 
        .markdown-rendered td {
            padding: 8px 12px;
            border: 1px solid var(--border-color);
            text-align: left;
        }

        .markdown-rendered th {
            background-color: var(--bg-tertiary);
            font-weight: bold;
        }

        .markdown-rendered hr {
            height: 2px;
            background-color: var(--border-color);
            border: none;
            margin: 20px 0;
        }

        .markdown-rendered img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
        }

        /* Footer Status Bar */
        footer {
            height: var(--footer-height);
            background-color: var(--bg-secondary);
            border-top: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 16px;
            font-size: 0.75rem;
            color: var(--text-secondary);
        }

        .stats-container {
            display: flex;
            gap: 16px;
        }

        /* Toast Notification */
        .toast {
            position: fixed;
            bottom: 40px;
            right: 20px;
            background-color: var(--text-primary);
            color: var(--bg-primary);
            padding: 8px 16px;
            border-radius: 6px;
            font-size: 0.85rem;
            box-shadow: var(--shadow);
            opacity: 0;
            transform: translateY(10px);
            transition: opacity 0.3s, transform 0.3s;
            pointer-events: none;
            z-index: 100;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        /* Responsive Design */
        @media (max-width: 768px) {
            .main-container {
                flex-direction: column;
            }
            .panel-left, .panel-right {
                width: 100% !important;
                height: 50%;
            }
            .resizer {
                height: 6px;
                width: 100%;
                cursor: row-resize;
            }
        }
    </style>
</head>
<body>

    <!-- Top Navigation Header -->
    <header>
        <div class="brand">
            <i class="fa-brands fa-markdown fa-lg"></i>
            <span>Markdown to HTML</span>
        </div>
        <div class="header-actions">
            <!-- Preset Templates Selector -->
            <select id="template-select" class="btn" title="Load Sample Template">
                <option value="" disabled selected>Load Template...</option>
                <option value="welcome">Welcome Guide</option>
                <option value="cheatsheet">Markdown Syntax Cheatsheet</option>
                <option value="table">Table & Code Example</option>
            </select>

            <!-- Theme Toggle -->
            <button id="theme-toggle" class="btn" title="Toggle Light/Dark Mode">
                <i class="fa-solid fa-moon"></i>
                <span id="theme-text">Dark Mode</span>
            </button>

            <!-- Download Button -->
            <button id="download-btn" class="btn btn-primary" title="Download HTML Document">
                <i class="fa-solid fa-download"></i>
                <span>Download HTML</span>
            </button>
        </div>
    </header>

    <!-- Main Workspace Container -->
    <div class="main-container">
        <!-- Editor Panel (Left) -->
        <div class="panel panel-left" id="editor-panel">
            <div class="panel-header">
                <span class="panel-title">
                    <i class="fa-solid fa-pen-to-square"></i> Markdown Input
                </span>
                <div class="panel-toolbar">
                    <button class="btn" onclick="clearEditor()" title="Clear Text">
                        <i class="fa-solid fa-trash-can"></i>
                    </button>
                </div>
            </div>
            <div class="editor-container">
                <textarea id="markdown-input" placeholder="Type or paste Markdown content here..." spellcheck="false"></textarea>
            </div>
        </div>

        <!-- Draggable Resizer Bar -->
        <div class="resizer" id="drag-resizer"></div>

        <!-- Preview Panel (Right) -->
        <div class="panel panel-right" id="preview-panel">
            <div class="panel-header">
                <span class="panel-title" id="preview-title">
                    <i class="fa-solid fa-eye"></i> Live Preview
                </span>
                <div class="panel-toolbar">
                    <button id="toggle-view-btn" class="btn" title="Toggle HTML Code View">
                        <i class="fa-solid fa-code"></i>
                        <span id="toggle-view-text">HTML Code</span>
                    </button>
                    <button id="copy-html-btn" class="btn" title="Copy Compiled HTML">
                        <i class="fa-solid fa-copy"></i>
                        <span>Copy</span>
                    </button>
                </div>
            </div>
            <div class="output-container">
                <div id="html-preview" class="markdown-rendered"></div>
                <textarea id="html-raw-view" readonly spellcheck="false"></textarea>
            </div>
        </div>
    </div>

    <!-- Bottom Status Bar -->
    <footer>
        <div class="stats-container">
            <span>Words: <strong id="word-count">0</strong></span>
            <span>Characters: <strong id="char-count">0</strong></span>
            <span>Lines: <strong id="line-count">0</strong></span>
        </div>
        <div>
            <span>Font: <strong>Verdana</strong></span>
        </div>
    </footer>

    <!-- Toast Alert Box -->
    <div id="toast" class="toast">Action completed successfully</div>

    <script>
        /**
         * Custom Lightweight Markdown Parser
         */
        class MarkdownParser {
            constructor() {
                // Pre-compile Regex Patterns
            }

            parse(markdown) {
                if (!markdown) return '';

                let html = markdown;

                // Escape HTML tags to prevent XSS / unwanted injection
                html = html.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");

                // Code Blocks (``` lang ... ```)
                html = html.replace(/```([\s\S]*?)```/g, function(match, code) {
                    return `<pre><code>${code.trim()}</code></pre>`;
                });

                // Inline Code (`code`)
                html = html.replace(/`([^`]+)`/g, '<code>$1</code>');

                // Headings (# - ######)
                html = html.replace(/^######\s+(.*$)/gim, '<h6>$1</h6>');
                html = html.replace(/^#####\s+(.*$)/gim, '<h5>$1</h5>');
                html = html.replace(/^####\s+(.*$)/gim, '<h4>$1</h4>');
                html = html.replace(/^###\s+(.*$)/gim, '<h3>$1</h3>');
                html = html.replace(/^##\s+(.*$)/gim, '<h2>$1</h2>');
                html = html.replace(/^#\s+(.*$)/gim, '<h1>$1</h1>');

                // Blockquotes (> Quote)
                html = html.replace(/^\&gt;\s+(.*$)/gim, '<blockquote>$1</blockquote>');

                // Horizontal Rule (---, ***, ___)
                html = html.replace(/^(\*{3,}|-{3,}|_{3,})$/gim, '<hr />');

                // Images (![alt](url))
                html = html.replace(/!\[([^\]]*)\]\(([^)]+)\)/g, '<img src="$2" alt="$1" />');

                // Links ([text](url))
                html = html.replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener noreferrer">$1</a>');

                // Bold (**text** or __text__)
                html = html.replace(/(\*\*|__)(.*?)\1/g, '<strong>$2</strong>');

                // Italic (*text* or _text_)
                html = html.replace(/(\*|_)(.*?)\1/g, '<em>$2</em>');

                // Tables
                html = this.parseTables(html);

                // Unordered Lists (*, -)
                html = html.replace(/^\s*[\*\-]\s+(.*$)/gim, '<ul><li>$1</li></ul>');
                html = html.replace(/<\/ul>\s*<ul>/g, ''); // Join adjacent list items

                // Ordered Lists (1., 2.)
                html = html.replace(/^\s*\d+\.\s+(.*$)/gim, '<ol><li>$1</li></ol>');
                html = html.replace(/<\/ol>\s*<ol>/g, ''); // Join adjacent list items

                // Paragraphs & Line Breaks
                const lines = html.split('\n');
                let inPre = false;
                let formattedLines = lines.map(line => {
                    if (line.includes('<pre>')) inPre = true;
                    if (line.includes('</pre>')) inPre = false;

                    // Don't add paragraph tags around structural HTML elements
                    if (!inPre && line.trim() !== '' && 
                        !line.match(/^<(\/?)(h[1-6]|ul|ol|li|blockquote|pre|table|thead|tbody|tr|th|td|hr)/i)) {
                        return `<p>${line.trim()}</p>`;
                    }
                    return line;
                });

                return formattedLines.join('\n');
            }

            parseTables(text) {
                const lines = text.split('\n');
                let inTable = false;
                let tableHtml = '';
                let result = [];

                for (let i = 0; i < lines.length; i++) {
                    let line = lines[i].trim();
                    
                    // Simple table detection based on pipe characters
                    if (line.startsWith('|') && line.endsWith('|')) {
                        // Header or Separator row check
                        if (line.includes('---')) {
                            continue; // Skip markdown alignment separator row
                        }

                        const cells = line.split('|').slice(1, -1).map(c => c.trim());
                        
                        if (!inTable) {
                            inTable = true;
                            tableHtml = '<table><thead><tr>';
                            cells.forEach(cell => { tableHtml += `<th>${cell}</th>`; });
                            tableHtml += '</tr></thead><tbody>';
                        } else {
                            tableHtml += '<tr>';
                            cells.forEach(cell => { tableHtml += `<td>${cell}</td>`; });
                            tableHtml += '</tr>';
                        }
                    } else {
                        if (inTable) {
                            inTable = false;
                            tableHtml += '</tbody></table>';
                            result.push(tableHtml);
                            tableHtml = '';
                        }
                        result.push(line);
                    }
                }

                if (inTable) {
                    tableHtml += '</tbody></table>';
                    result.push(tableHtml);
                }

                return result.join('\n');
            }
        }

        // App Initialization & State Management
        const parser = new MarkdownParser();
        const editor = document.getElementById('markdown-input');
        const preview = document.getElementById('html-preview');
        const rawView = document.getElementById('html-raw-view');
        const wordCount = document.getElementById('word-count');
        const charCount = document.getElementById('char-count');
        const lineCount = document.getElementById('line-count');
        const toggleViewBtn = document.getElementById('toggle-view-btn');
        const toggleViewText = document.getElementById('toggle-view-text');
        const previewTitle = document.getElementById('preview-title');

        let isRawView = false;

        // Sample Markdown Templates
        const templates = {
            welcome: `# Welcome to Markdown Converter!

A clean, modern tool built with **pure JavaScript** and rendered in **Verdana** font.

## Features
* **Live Preview**: See changes as you type.
* **Custom Parser**: Supports standard Markdown tags.
* **Responsive Layout**: Adjust pane sizing effortlessly.

> "Simplicity is prerequisite for reliability." – Edsger W. Dijkstra

Feel free to edit this text or load other templates!`,

            cheatsheet: `# Markdown Syntax Cheatsheet

## Text Formatting
* *Italic text* using single asterisks
* **Bold text** using double asterisks
* \`Inline Code\` wrapped in backticks

## Headings
# Heading 1
## Heading 2
### Heading 3

## Lists
### Unordered
* Item 1
* Item 2
* Item 3

### Ordered
1. First step
2. Second step
3. Third step

## Links & Images
[Visit Google](https://www.google.com)
![Placeholder Image](https://via.placeholder.com/300x100)`,

            table: `# Sample Table & Code Block

## Programming Comparison Table

| Language | Primary Use | Type |
| Python | Data Science / Web | Dynamic |
| JavaScript | Web Development | Dynamic |
| Rust | Systems Programming | Static |

## Code Example

\`\`\`
function greet(name) {
    console.log("Hello, " + name + "!");
}

greet("Developer");
\`\`\``
        };

        // Render Markdown to HTML Function
        function renderMarkdown() {
            const markdownText = editor.value;
            const compiledHtml = parser.parse(markdownText);

            preview.innerHTML = compiledHtml;
            rawView.value = compiledHtml;

            updateStats(markdownText);
        }

        // Statistics Counter Update
        function updateStats(text) {
            charCount.textContent = text.length;
            
            const words = text.trim() ? text.trim().split(/\s+/).length : 0;
            wordCount.textContent = words;

            const lines = text ? text.split('\n').length : 0;
            lineCount.textContent = lines;
        }

        // Clear Editor
        function clearEditor() {
            editor.value = '';
            renderMarkdown();
            showToast('Editor cleared');
        }

        // Toggle Raw HTML Code View
        toggleViewBtn.addEventListener('click', () => {
            isRawView = !isRawView;
            if (isRawView) {
                preview.style.display = 'none';
                rawView.style.display = 'block';
                toggleViewText.textContent = 'Live Preview';
                previewTitle.innerHTML = '<i class="fa-solid fa-code"></i> HTML Output';
            } else {
                preview.style.display = 'block';
                rawView.style.display = 'none';
                toggleViewText.textContent = 'HTML Code';
                previewTitle.innerHTML = '<i class="fa-solid fa-eye"></i> Live Preview';
            }
        });

        // Copy HTML Code to Clipboard
        document.getElementById('copy-html-btn').addEventListener('click', () => {
            const htmlText = rawView.value;
            
            // Fallback clipboard method for iframe environments
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = htmlText;
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            document.execCommand('copy');
            document.body.removeChild(tempTextArea);

            showToast('HTML copied to clipboard!');
        });

        // Download HTML Document
        document.getElementById('download-btn').addEventListener('click', () => {
            const compiledHtml = rawView.value;
            const fullDoc = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exported Document</title>
    <style>
        body { font-family: Verdana, Geneva, Tahoma, sans-serif; line-height: 1.6; padding: 30px; max-width: 800px; margin: 0 auto; color: #0f172a; }
        blockquote { border-left: 4px solid #2563eb; padding-left: 12px; color: #475569; margin: 0; }
        code { background: #f1f5f9; padding: 2px 6px; border-radius: 4px; font-family: monospace; }
        pre { background: #f1f5f9; padding: 12px; border-radius: 6px; overflow-x: auto; }
        table { border-collapse: collapse; width: 100%; margin: 16px 0; }
        th, td { border: 1px solid #cbd5e1; padding: 8px 12px; text-align: left; }
        th { background-color: #f1f5f9; }
    </style>
</head>
<body>
${compiledHtml}
</body>
</html>`;

            const blob = new Blob([fullDoc], { type: 'text/html' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'document.html';
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);

            showToast('HTML File Downloaded!');
        });

        // Load Preset Templates
        document.getElementById('template-select').addEventListener('change', (e) => {
            const selectedKey = e.target.value;
            if (templates[selectedKey]) {
                editor.value = templates[selectedKey];
                renderMarkdown();
                showToast(`Loaded "${e.target.options[e.target.selectedIndex].text}" template`);
            }
            e.target.value = ''; // Reset select list
        });

        // Light / Dark Theme Switching
        const themeToggleBtn = document.getElementById('theme-toggle');
        const themeText = document.getElementById('theme-text');

        themeToggleBtn.addEventListener('click', () => {
            const currentTheme = document.body.getAttribute('data-theme');
            if (currentTheme === 'dark') {
                document.body.removeAttribute('data-theme');
                themeText.textContent = 'Dark Mode';
                themeToggleBtn.querySelector('i').className = 'fa-solid fa-moon';
            } else {
                document.body.setAttribute('data-theme', 'dark');
                themeText.textContent = 'Light Mode';
                themeToggleBtn.querySelector('i').className = 'fa-solid fa-sun';
            }
        });

        // Toast Notification Display
        function showToast(message) {
            const toast = document.getElementById('toast');
            toast.textContent = message;
            toast.classList.add('show');
            setTimeout(() => {
                toast.classList.remove('show');
            }, 2500);
        }

        // Resizable Split Pane Logic
        const resizer = document.getElementById('drag-resizer');
        const leftPanel = document.getElementById('editor-panel');
        const rightPanel = document.getElementById('preview-panel');
        let isDragging = false;

        resizer.addEventListener('mousedown', (e) => {
            isDragging = true;
            resizer.classList.add('dragging');
            document.body.style.cursor = 'col-resize';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isDragging) return;

            const containerWidth = document.querySelector('.main-container').offsetWidth;
            let leftWidthPercent = (e.clientX / containerWidth) * 100;

            // Clamp panel size boundaries between 20% and 80%
            if (leftWidthPercent < 20) leftWidthPercent = 20;
            if (leftWidthPercent > 80) leftWidthPercent = 80;

            leftPanel.style.width = `${leftWidthPercent}%`;
            rightPanel.style.width = `${100 - leftWidthPercent}%`;
        });

        document.addEventListener('mouseup', () => {
            if (isDragging) {
                isDragging = false;
                resizer.classList.remove('dragging');
                document.body.style.cursor = 'default';
            }
        });

        // Live Input Listener
        editor.addEventListener('input', renderMarkdown);

        // Initial Initialization Load
        window.onload = () => {
            editor.value = templates.welcome;
            renderMarkdown();
        };
    </script>
</body>
</html>
